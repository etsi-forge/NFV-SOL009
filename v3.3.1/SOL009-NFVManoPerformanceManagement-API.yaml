        _links:
          description: |
            Links for this resource.
          type: object
          properties:
            self:
              description: |
                This type represents a link to a resource using an absolute URI.
              type: object
              required:
                - href
              properties:
                href:
                  description: |
                    String formatted according to IETF RFC 3986.
                  type: string
            object:
              description: |
                This type represents a link to a resource using an absolute URI.
              type: object
              required:
                - href
              properties:
                href:
                  description: |
                    String formatted according to IETF RFC 3986.
                  type: string
          required:
