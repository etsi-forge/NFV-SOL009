    IndividualPmJob.Get.200:
      description: >
        200 OK

        Shall be returned when information about an individual PM job  has been
        read successfully.

        The response body shall contain a representation of the "Individual PM
        job" resource, as defined in clause 6.6.2.7.
      headers:
        WWW-Authenticate:
          description: >
            Challenge if the corresponding HTTP request has not provided
            authorization, or error details if the corresponding HTTP request
            has provided an invalid authorization token.
          schema:
            type: string
        Version:
          description: |
            Version of the API used in the response.
          schema:
            type: string
      content:
        application/json:
          schema:
            description: |
              This type represents a PM job.
            type: object
            required:
              - id
              - objectType
              - objectInstanceIds
              - criteria
              - _links
              - callbackUri
            properties:
              id:
                description: |
                  An identifier with the intention of being globally unique.
                type: string
              objectType:
                description: >
                  Type of measured object. The applicable measured object type
                  for a measurement is defined in clause 8.2 of ETSI GS NFV-IFA
                  031.
                type: string
              objectInstanceIds:
                description: >
                  Identifiers of the measured object instance for which
                  performance information is collected. This attribute shall
                  contain the identifier of the instance of the measure object
                  according to their type. See also definitions in clause 8.2 of
                  ETSI GS NFV-IFA 031.
                type: array
                items:
                  description: |
                    An identifier with the intention of being globally unique.
                  type: string
                minItems: 1
              subObjectInstanceIds:
                description: >
                  Identifiers of the sub-object instances of the measured object
                  instance for which performance information is requested to be
                  collected. May be present if a sub-object is defined in clause
                  8.2 of ETSI GS NFV-IFA 031 for the related measured object
                  type. If this attribute is present, the cardinality of the
                  "objectInstanceIds" attribute shall be 1. If this attribute is
                  absent and a sub-object is defined in clause 8.2 of ETSI GS
                  NFV-IFA 031 for the related measured object type, measurements
                  will be taken for all sub-object instances of the measured
                  object instance.
                type: array
                items:
                  description: >
                    An identifier that is unique for the respective type within
                    a NFV-MANO functional entity, but that need not be globally
                    unique. Representation: string of variable length..
                  type: string
              criteria:
                description: "This type represents collection criteria for PM jobs. * NOTE 1:\tAt the end of each reportingPeriod, the producer will inform the API consumer about availability\n            of the performance data collected for each completed collection period during this reportingPeriod.\n            The reportingPeriod should be equal to or a multiple of the collectionPeriod. In the latter case,\n            the performance data for the collection periods within one reporting period are reported together.\n* NOTE 2:\tIn particular when choosing short collection and reporting periods, the number of PM jobs that can\n            be supported depends on the capability of the producing entity.\n"
                type: object
                required:
                  - collectionPeriod
                  - reportingPeriod
                properties:
                  performanceMetric:
                    description: >
                      This defines the types of performance metrics for the
                      specified measured object(s). This attribute’s value shall
                      contain the related "Measurement Name" values as defined
                      in clause 8.4 of ETSI GS NFV-IFA 031. At least one of the
                      two attributes (performance metric or group) shall be
                      present.
                    type: array
                    items:
                      type: string
                  performanceMetricGroup:
                    description: >
                      Group of performance metrics. A metric group is a
                      pre-defined list of metrics, known to the producer that it
                      can decompose to individual metrics. This attribute’s
                      value shall contain the related "Measurement Group" values
                      as defined in clause 8.4 of ETSI GS NFV-IFA 031. At least
                      one of the two attributes (performance metric or group)
                      shall be present.
                    type: array
                    items:
                      type: string
                  collectionPeriod:
                    description: >
                      Specifies the periodicity at which the producer will
                      collect performance information. The unit shall be
                      seconds. See note 1 and note 2.
                    type: integer
                  reportingPeriod:
                    description: >
                      Specifies the periodicity at which the producer will
                      report to the API consumer about performance information.
                      The unit shall be seconds. See note 1 and note 2.
                    type: integer
                  reportingBoundary:
                    description: >
                      Date-time stamp. Representation: String formatted
                      according to IETF RFC 3339.
                    type: string
                    format: date-time
              callbackUri:
                description: |
                  String formatted according to IETF RFC 3986.
                type: string
              reports:
                description: |
                  Information about available reports collected by this PM job.
                type: array
                items:
                  type: object
                  properties:
                    href:
                      description: |
                        String formatted according to IETF RFC 3986.
                      type: string
                    readyTime:
                      description: >
                        Date-time stamp. Representation: String formatted
                        according to IETF RFC 3339.
                      type: string
                      format: date-time
                    expiryTime:
                      description: >
                        Date-time stamp. Representation: String formatted
                        according to IETF RFC 3339.
                      type: string
                      format: date-time
                    fileSize:
                      description: |
                        Unsigned integer
                      type: number
                  required:
                    - href
                    - readyTime
              _links:
                description: |
                  Links for this resource.
                type: object
                properties:
                  self:
                    description: >
                      This type represents a link to a resource using an
                      absolute URI.
                    type: object
                    required:
                      - href
                    properties:
                      href:
                        description: |
                          String formatted according to IETF RFC 3986.
                        type: string
                  objects:
                    description: >
                      Links to resources representing the measured object
                      instances for which performance information is collected.
                      Shall be present if the measured object instance
                      information is accessible as a resource.
                    type: array
                    items:
                      description: >
                        This type represents a link to a resource using an
                        absolute URI.
                      type: object
                      required:
                        - href
                      properties:
                        href:
                          description: |
                            String formatted according to IETF RFC 3986.
                          type: string
                required:
                  - self
    IndividualPmJob.Patch.200:
      description: >
        200 OK

        Shall be returned when the request has been processed successfully.

        The response body shall contain a data structure of type
        "PmJobModifications"
      headers:
        WWW-Authenticate:
          description: >
            Challenge if the corresponding HTTP request has not provided
            authorization, or error details if the corresponding HTTP request
            has provided an invalid authorization token.
          schema:
            type: string
        Version:
          description: |
            Version of the API used in the response.
          schema:
            type: string
      content:
        application/json:
          schema:
            description: >
              This type represents modifications to a PM job. * NOTE: At least
              one of the attributes defined in this type shall be present in
              request bodies.
            type: object
            properties:
              callbackUri:
                description: |
                  String formatted according to IETF RFC 3986.
                type: string
              authentication:
                type: object
                required:
                  - authType
                properties:
                  authType:
                    description: >
                      Defines the types of Authentication / Authorization which
                      the API consumer is willing to accept when receiving a
                      notification. Permitted values: * BASIC: In every HTTP
                      request to the notification endpoint, use
                        HTTP Basic authentication with the client credentials.
                      * OAUTH2_CLIENT_CREDENTIALS: In every HTTP request to the
                        notification endpoint, use an OAuth 2.0 Bearer token, obtained
                        using the client credentials grant type.
                      * TLS_CERT: Every HTTP request to the notification
                      endpoint is sent
                        over a mutually authenticated TLS session, i.e. not only the
                        server is authenticated, but also the client is authenticated
                        during the TLS tunnel setup.
                    type: array
                    items:
                      type: string
                      enum:
                        - BASIC
                        - OAUTH2_CLIENT_CREDENTIALS
                        - TLS_CERT
                  paramsBasic:
                    description: >
                      Parameters for authentication/authorization using BASIC.
                      Shall be present if authType is "BASIC" and the contained
                      information has not been provisioned out of band. Shall be
                      absent otherwise.
                    type: object
                    properties:
                      userName:
                        description: >
                          Username to be used in HTTP Basic authentication.
                          Shall be present if it has not been provisioned out of
                          band.
                        type: string
                      password:
                        description: >
                          Password to be used in HTTP Basic authentication.
                          Shall be present if it has not been provisioned out of
                          band.
                        type: string
                  paramsOauth2ClientCredentials:
                    description: >
                      Parameters for authentication/authorization using
                      OAUTH2_CLIENT_CREDENTIALS. Shall be present if authType is
                      "OAUTH2_CLIENT_CREDENTIALS" and the contained information
                      has not been provisioned out of band. Shall be absent
                      otherwise.
                    type: object
                    properties:
                      clientId:
                        description: >
                          Client identifier to be used in the access token
                          request of the OAuth 2.0 client credentials grant
                          type. Shall be present if it has not been provisioned
                          out of band. The clientId and clientPassword passed in
                          a subscription shall not be the same as the clientId
                          and clientPassword that are used to obtain
                          authorization for API requests. Client credentials may
                          differ between subscriptions. The value of
                          clientPassword should be generated by a random
                          process.
                        type: string
                      clientPassword:
                        description: >
                          Client password to be used in the access token request
                          of the OAuth 2.0 client credentials grant type. Shall
                          be present if it has not been provisioned out of band.
                          The clientId and clientPassword passed in a
                          subscription shall not be the same as the clientId and
                          clientPassword that are used to obtain authorization
                          for API requests. Client credentials may differ
                          between subscriptions. The value of clientPassword
                          should be generated by a random process.
                        type: string
                      tokenEndpoint:
                        description: |
                          String formatted according to IETF RFC 3986.
                        type: string
