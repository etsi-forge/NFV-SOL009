            type: string
            format: url
            minimum: 1
            maximum: 1
        WWW-Authenticate:
          description: >
            Challenge if the corresponding HTTP request has not provided
            authorization, or error details if the corresponding HTTP request
            has provided an invalid authorization token.
          schema:
            type: string
            minimum: 0
            maximum: 1
      content:
        application/json:
          schema:
            description: >
              This type represents a subscription related to notifications about
              VNF faults.
            type: object
            required:
              - id
              - callbackUri
              - _links
            properties:
              id:
                description: |
                  An identifier with the intention of being globally unique.
                type: string
              filter:
                description: "This type represents a subscription filter related to notifications about NFV-MANO functional entity faults. It shall comply with the provisions defined in table 7.6.3.2-1. At a particular nesting level in the filter structure, the following applies: All attributes shall match in order for the filter to match (logical \"and\" between different filter attributes). If an attribute is an array, the attribute shall match if at least one of the values in the array matches (logical \"or\" between the values of one filter attribute). * NOTE:\tThe permitted values of the \"notificationTypes\" attribute are spelled exactly as the names\n        of the notification types to facilitate automated code generation systems.\n"
                type: object
                properties:
                  notificationTypes:
                    description: >
                      Match particular notification types. Permitted values: *
                      AlarmNotification * AlarmClearedNotification *
                      AlarmListRebuiltNotification

                      See note.
                    type: array
                    items:
                      type: string
                      enum:
                        - AlarmNotification
                        - AlarmClearedNotification
                        - AlarmListRebuiltNotification
                  perceivedSeverities:
                    description: >
                      Match VNF alarms with a perceived severity listed in this
                      attribute.
                    type: array
                    items:
                      description: >
                        Indicates the relative level of urgency for operator
                        attention. * CRITICAL: The Critical severity level
                        indicates that a service
                          affecting condition has occurred and an immediate corrective action
                          is required. Such a severity can be reported, for example, when a
                          managed object becomes totally out of service and its capability needs
                          to be restored (ITU-T Recommendation X.733).
                        * MAJOR: The Major severity level indicates that a
                        service affecting
                          condition has developed and an urgent corrective action is required.
                          Such a severity can be reported, for example, when there is a severe
                          degradation in the capability of the managed object and its full
                          capability needs to be restored (ITU-T Recommendation X.733).
